<!doctype html>
<html lang="pt-br"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>admin · loja</title><link rel="stylesheet" href="/style.css">
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--b1);background:var(--bg0);padding:16px 8px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{padding:8px 12px 16px;color:var(--t1);font-weight:590}
.nav{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:6px;color:var(--t3);text-decoration:none;font-size:13px;font-weight:510}
.nav:hover{background:rgba(255,255,255,.03);color:var(--t1)}
.nav.on{background:rgba(255,255,255,.05);color:var(--t1)}
.side .bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.main{padding:32px;max-width:1200px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
.kpi{padding:16px}.kpi .v{color:var(--t1);font-size:24px;font-weight:590;letter-spacing:-.24px;font-variant-numeric:tabular-nums;margin-top:4px}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(255,255,255,.02)}
.badge.neutral{color:var(--t3);border-color:var(--b2);background:rgba(255,255,255,.02)}
.badge.brand{color:var(--brand3);border-color:rgba(113,112,255,.3);background:rgba(94,106,210,.1)}
.badge.err{color:var(--err);border-color:rgba(229,72,77,.3);background:rgba(229,72,77,.1)}
.btn.danger{background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.3);color:var(--err)}
textarea{width:100%;min-height:96px;padding:8px 12px;background:var(--bg1);border:1px solid var(--b2);border-radius:8px;color:var(--t1);font:400 13px ui-monospace,'SF Mono',Menlo,monospace;resize:vertical}
textarea:focus{outline:none;border-color:var(--brand2)}
.drop{border:1px dashed rgba(255,255,255,.12);border-radius:8px;padding:24px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.drop:hover,.drop.over{border-color:var(--brand2);background:rgba(94,106,210,.05)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--b1);padding:0 16px}
.tab{height:40px;padding:0 8px;background:none;border:0;border-bottom:1px solid transparent;color:var(--t3);font:510 13px 'Inter Variable',Inter,sans-serif;cursor:pointer;margin-bottom:-1px}
.tab.on{color:var(--t1);border-bottom-color:var(--brand2)}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.toast{margin-top:16px;padding:8px 12px;border:1px solid var(--b2);border-left:2px solid var(--ok);border-radius:8px;background:var(--bg1);font-size:13px}
.toast.bad{border-left-color:var(--err)}
.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login .card{width:360px;padding:32px;display:flex;flex-direction:column;gap:16px}
</style>
</head><body>
<div id="app"></div>
<script>
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=s=>s?new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' mb':Math.max(1,Math.round(n/1024))+' kb';
const $=id=>document.getElementById(id);
const I={
  box:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>',
  list:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  ext:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  out:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/></svg>',
  up:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8a8f98" stroke-width="1.5"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
  file:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8l-5-5Z"/><path d="M14 3v5h5"/></svg>',
  txt:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
};
async function api(path,opt={}){
  const r=await fetch('/api/admin'+path,{headers:{'Content-Type':'application/json'},...opt,body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401&&path!=='/login'){renderLogin();throw new Error('auth')}
  const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'erro'); return d;
}
let flash='';

// ---------- login ----------
function renderLogin(){
  $('app').innerHTML=`<div class="login"><form class="card" id="lf">
    <h2>admin</h2><p class="muted small">entre com a senha definida em ADMIN_PASSWORD</p>
    <label>senha<input type="password" id="pw" autofocus></label><div class="err" id="le"></div>
    <button class="btn primary full">entrar</button></form></div>`;
  $('lf').onsubmit=async e=>{e.preventDefault();try{await api('/login',{method:'POST',body:{password:$('pw').value}});route()}catch(x){$('le').textContent=x.message}};
}

// ---------- shell ----------
function shell(active,html){
  $('app').innerHTML=`<div class="app">
    <aside class="side"><div class="brand">loja · admin</div>
      <a class="nav ${active==='p'?'on':''}" href="#/produtos">${I.box} produtos</a>
      <a class="nav ${active==='o'?'on':''}" href="#/pedidos">${I.list} pedidos</a>
      <div class="bottom"><a class="nav" href="/" target="_blank">${I.ext} ver loja</a><a class="nav" href="#" onclick="logout();return false">${I.out} sair</a></div>
    </aside><main class="main" id="main">${html}</main></div>`;
}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});renderLogin()}
function msg(){if(!flash)return'';const f=flash;flash='';return `<div class="toast ${f.startsWith('!')?'bad':''}">${esc(f.replace(/^!/,''))}</div>`}

// ---------- produtos ----------
async function viewProducts(){
  shell('p','<div class="skel" style="height:400px"></div>');
  const [s,ps]=await Promise.all([api('/summary'),api('/products')]);
  $('main').innerHTML=`
  <div class="top"><h1 style="font-size:24px;letter-spacing:-.24px">produtos</h1><button class="btn primary" onclick="location.hash='#/produtos/novo'">novo produto</button></div>
  ${s.mock?'<div class="toast" style="border-left-color:var(--warn);margin:0 0 24px">modo teste · sem WIINPAY_API_KEY os pix são simulados</div>':''}
  <div class="kpis">
    <div class="card kpi"><div class="xs muted">faturamento</div><div class="v">${brl(s.revenue)}</div></div>
    <div class="card kpi"><div class="xs muted">pedidos pagos</div><div class="v">${s.paid}</div></div>
    <div class="card kpi"><div class="xs muted">unidades em estoque</div><div class="v">${s.stock}</div></div>
    <div class="card kpi" ${s.issues?'style="border-color:rgba(229,72,77,.3)"':''}><div class="xs muted">pagos sem estoque</div><div class="v" ${s.issues?'style="color:var(--err)"':''}>${s.issues}</div></div>
  </div>
  <div class="card" style="overflow:hidden">${ps.length?`<table><thead><tr><th>produto</th><th class="r">preço</th><th class="r">em estoque</th><th class="r">reservado</th><th class="r">vendido</th><th>status</th></tr></thead><tbody>
    ${ps.map(p=>`<tr class="click" onclick="location.hash='#/produtos/${p.id}'"><td style="color:var(--t1)">${esc(p.name)}</td><td class="r">${brl(p.price)}</td>
      <td class="r" style="color:${p.stock?'var(--t1)':'var(--err)'}">${p.stock}</td><td class="r">${p.reserved}</td><td class="r">${p.sold}</td>
      <td>${!p.active?'<span class="badge neutral">oculto</span>':p.stock?'<span class="badge ok"><span class="dot"></span>à venda</span>':'<span class="badge err">esgotado</span>'}</td></tr>`).join('')}
  </tbody></table>`:`<div class="empty">${I.box}<div style="color:var(--t1)">nenhum produto</div><div class="muted small">crie o primeiro e suba o estoque</div></div>`}</div>`;
}

// ---------- produto (novo / editar + estoque) ----------
let tab='file', unitFilter='all';
async function viewProduct(id){
  shell('p','<div class="skel" style="height:400px"></div>');
  const isNew=id==='novo';
  const d=isNew?{product:{name:'',description:'',price:'',image:'',active:true,stock:0,reserved:0,sold:0},units:[]}:await api('/products/'+id);
  const p=d.product, units=d.units.filter(u=>unitFilter==='all'||u.status===unitFilter);
  const badge=s=>({available:'<span class="badge ok"><span class="dot"></span>disponível</span>',reserved:'<span class="badge wait"><span class="dot"></span>reservado</span>',delivered:'<span class="badge brand">entregue</span>'})[s];
  $('main').innerHTML=`
  <div class="top"><div style="display:flex;align-items:center;gap:8px"><a class="btn ghost" href="#/produtos">← produtos</a><h1 style="font-size:24px;letter-spacing:-.24px">${isNew?'novo produto':esc(p.name)}</h1></div></div>
  ${msg()}
  <div style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;margin-top:16px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:24px">
    ${isNew?'':`
      <div class="card" style="overflow:hidden">
        <div style="padding:16px;display:flex;justify-content:space-between;align-items:center"><div><h2>estoque</h2><p class="muted small">cada unidade é entregue pra um único cliente</p></div>
          <div style="display:flex;gap:8px;align-items:baseline"><span style="color:var(--t1);font-size:24px;font-weight:590">${p.stock}</span><span class="muted small">disponíveis</span></div></div>
        <div class="tabs"><button class="tab ${tab==='file'?'on':''}" onclick="tab='file';viewProduct('${id}')">subir arquivos</button><button class="tab ${tab==='text'?'on':''}" onclick="tab='text';viewProduct('${id}')">colar textos</button></div>
        <div style="padding:16px">
        ${tab==='file'?`
          <label class="drop" id="drop">${I.up}<div style="color:var(--t1)">arraste os arquivos aqui ou clique</div><div class="muted small">1 arquivo = 1 unidade de estoque · pdf, docx, zip, imagem… até 25 mb cada</div>
          <input type="file" multiple id="files" style="display:none"></label>`:`
          <textarea id="texts" placeholder="uma unidade por linha&#10;ex: login:senha, chave de ativação, link único…"></textarea>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><span class="muted small" id="tcount">0 unidades</span><button class="btn primary" onclick="addTexts('${id}')">adicionar ao estoque</button></div>`}
          <div id="upmsg" class="muted small" style="margin-top:8px"></div>
        </div>
        <div style="padding:8px 16px;display:flex;gap:4px;border-top:1px solid var(--b1)">
          ${[['all','todas',d.units.length],['available','disponíveis',p.stock],['reserved','reservadas',p.reserved],['delivered','entregues',p.sold]].map(([k,l,n])=>`<button class="btn ${unitFilter===k?'':'ghost'}" style="height:28px" onclick="unitFilter='${k}';viewProduct('${id}')">${l} <span class="muted">${n}</span></button>`).join('')}
        </div>
        ${units.length?`<table><thead><tr><th>unidade</th><th>status</th><th>pedido</th><th class="r"></th></tr></thead><tbody>
          ${units.map(u=>`<tr><td><div style="display:flex;align-items:center;gap:8px;color:var(--t1)"><span class="muted">${u.type==='file'?I.file:I.txt}</span>
              ${u.type==='file'?`<a href="/api/admin/stock/${u.id}/file" style="color:inherit" class="trunc">${esc(u.filename)}</a><span class="muted xs">${kb(u.size)}</span>`:`<span class="mono trunc">${esc(u.text)}</span>`}</div></td>
            <td>${badge(u.status)}</td><td>${u.order_id?`<a class="mono" style="color:var(--t2)" href="#/pedidos">#${u.order_id}</a>`:'<span class="muted">—</span>'}</td>
            <td class="r">${u.status==='available'?`<button class="btn ghost" style="height:28px" onclick="delUnit('${u.id}','${id}')">remover</button>`:''}</td></tr>`).join('')}
        </tbody></table>`:`<div class="empty" style="border-top:1px solid var(--b1)"><div class="muted small">nenhuma unidade aqui</div></div>`}
      </div>`}
    </div>
    <form class="card" id="pf" style="padding:24px;display:flex;flex-direction:column;gap:16px;${isNew?'grid-column:1/-1;max-width:560px':''}">
      <h2>dados do produto</h2>
      <label>nome<input name="name" value="${esc(p.name)}" required></label>
      <label>descrição<textarea name="description" style="font-family:inherit;min-height:72px">${esc(p.description)}</textarea></label>
      <label>preço (r$)<input name="price" type="number" step="0.01" min="0.01" value="${p.price}" required></label>
      <label><span>url da imagem <span class="xs muted">· opcional</span></span><input name="image" value="${esc(p.image)}" placeholder="https://…"></label>
      <label style="flex-direction:row;align-items:center;gap:8px;color:var(--t2)"><input type="checkbox" name="active" style="width:16px;height:16px" ${p.active?'checked':''}> visível na loja</label>
      <div class="err" id="pe"></div>
      <button class="btn primary full">${isNew?'criar produto':'salvar alterações'}</button>
      ${isNew?'<p class="muted small">depois de criar você sobe o estoque (arquivos ou textos).</p>':''}
    </form>
  </div>`;
  $('pf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    const body={name:f.get('name'),description:f.get('description'),price:Number(f.get('price')),image:f.get('image'),active:f.get('active')==='on'};
    try{const r=await api(isNew?'/products':'/products/'+id,{method:isNew?'POST':'PUT',body});flash=isNew?'produto criado · agora suba o estoque':'alterações salvas';location.hash='#/produtos/'+r.id;if(!isNew)viewProduct(id)}catch(x){$('pe').textContent=x.message}};
  if(!isNew&&tab==='file'){const dr=$('drop');$('files').onchange=e=>upload(id,e.target.files);
    dr.ondragover=e=>{e.preventDefault();dr.classList.add('over')};dr.ondragleave=()=>dr.classList.remove('over');
    dr.ondrop=e=>{e.preventDefault();dr.classList.remove('over');upload(id,e.dataTransfer.files)}}
  if(!isNew&&tab==='text'){$('texts').oninput=e=>{const n=e.target.value.split('\n').filter(x=>x.trim()).length;$('tcount').textContent=n+(n===1?' unidade':' unidades')}}
}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
async function upload(id,list){
  const files=[...list]; let done=0;
  for(const f of files){
    if(f.size>25*1048576){flash='!'+f.name+' passou de 25 mb';continue}
    $('upmsg').textContent=`enviando ${done+1} de ${files.length}…`;
    await api('/products/'+id+'/stock',{method:'POST',body:{files:[{name:f.name,mime:f.type,data:await b64(f)}]}}); done++;
  }
  flash=flash||`${done} ${done===1?'unidade adicionada':'unidades adicionadas'} ao estoque`; viewProduct(id);
}
async function addTexts(id){
  const texts=$('texts').value.split('\n').map(x=>x.trim()).filter(Boolean); if(!texts.length)return;
  const r=await api('/products/'+id+'/stock',{method:'POST',body:{texts}}); flash=`${r.added} ${r.added===1?'unidade adicionada':'unidades adicionadas'} ao estoque`; viewProduct(id);
}
async function delUnit(uid,id){try{await api('/stock/'+uid,{method:'DELETE'});flash='unidade removida'}catch(x){flash='!'+x.message}viewProduct(id)}

// ---------- pedidos ----------
async function viewOrders(){
  shell('o','<div class="skel" style="height:400px"></div>');
  const os=await api('/orders');
  const st=o=>o.status==='paid'?(o.missing?`<span class="badge err">pago · faltou ${o.missing}</span>`:'<span class="badge ok"><span class="dot"></span>pago</span>'):'<span class="badge wait"><span class="dot"></span>aguardando</span>';
  $('main').innerHTML=`<div class="top"><h1 style="font-size:24px;letter-spacing:-.24px">pedidos</h1><span class="muted small">${os.length} no total</span></div>
  <div class="card" style="overflow:hidden">${os.length?`<table><thead><tr><th>pedido</th><th>cliente</th><th>itens</th><th>entregue</th><th class="r">total</th><th>status</th><th>data</th></tr></thead><tbody>
    ${os.map(o=>`<tr><td><a class="mono" style="color:var(--t1)" href="/pedido/${o.id}?t=${o.token}" target="_blank">#${o.id}</a></td>
      <td><div style="color:var(--t1)">${esc(o.customer.name)}</div><div class="muted xs">${esc(o.customer.email)} · ${esc(o.customer.phone)}</div></td>
      <td>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join('<br>')}</td>
      <td>${o.units.length?o.units.map(u=>`<div class="mono trunc muted" style="max-width:200px" title="${esc(u.label)}">${esc(u.label)}</div>`).join(''):'<span class="muted">—</span>'}</td>
      <td class="r">${brl(o.total)}</td><td>${st(o)}</td><td class="muted">${dt(o.paid_at||o.created_at)}</td></tr>`).join('')}
  </tbody></table>`:`<div class="empty">${I.list}<div style="color:var(--t1)">nenhum pedido ainda</div><div class="muted small">os pedidos aparecem aqui assim que alguém gera um pix</div></div>`}</div>`;
}

// ---------- router ----------
async function route(){
  const h=location.hash||'#/produtos';
  try{
    let m;
    if((m=h.match(/^#\/produtos\/(.+)$/))) await viewProduct(m[1]);
    else if(h.startsWith('#/pedidos')) await viewOrders();
    else await viewProducts();
  }catch(e){if(e.message!=='auth'){flash='!'+e.message;console.error(e)}}
}
window.onhashchange=()=>{tab='file';unitFilter='all';route()};
route();
</script>
</body></html>
